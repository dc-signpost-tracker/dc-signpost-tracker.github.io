name: Refresh signposts

on:
  schedule:
    - cron: "17 22 * * *"   # daily at 06:17 Singapore time (22:17 UTC)
  workflow_dispatch:         # the "Run workflow" button, for an owner-triggered refresh

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the feeds
        run: python scripts/refresh.py
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      - name: Save what changed
        if: always()
        run: |
          git config user.name "signpost-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh signposts ($(date -u +%F))"
          git push
